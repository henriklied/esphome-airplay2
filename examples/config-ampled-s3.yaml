# Amped-S3 (ESP32-S3) example — PCM5100 pins for that board.
# Schema/codegen-validation config — no secrets, so it validates standalone.
# The real config.yaml uses !secret placeholders resolved from secrets.yaml.
esphome:
  name: airplay2
  friendly_name: AirPlay2
  min_version: 2025.1.0

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  cpu_frequency: 240MHz
  flash_size: 8MB
  # N8R8: quad flash (8MB) + octal PSRAM (8MB). The vendor's working board
  # config uses dio for the flash — opi is not valid here.
  flash_mode: dio
  flash_frequency: 80MHz
  framework:
    type: esp-idf
    version: recommended
  toolchain: esp-idf
  partitions: partitions.csv

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: "gate-ssid"
  password: "gate-password"

logger:

external_components:
  - source:
      type: local
      path: components
    components:
      - airplay_receiver

airplay_receiver:
  id: airplay_1
  name: "AirPlay2"
  buffer_size: 1000000
  # Amped-ESP32 (ESP32-S3) I2S PCM5100 + amp-enable wiring.
  i2s_bclk_pin: 14
  i2s_lrclk_pin: 15
  i2s_dout_pin: 16
  amp_enable_pin: 17
  sample_rate: 44100
  # Amp power-down after this many seconds without audio (pause/idle); 0 disables.
  amp_idle_timeout: 60
