# Speaker correction on the board, tunable from Home Assistant.
#
# A direct AirPlay stream goes from the phone to this board. It never passes
# through Music Assistant, so MA's per-player EQ, high-pass and limiter never
# apply. If the speaker needs correction, it has to happen here.
#
# The cascade below is a starting point for a small sealed two-way in a
# bookshelf: protect the woofer below its useful range, lift the bass a little
# to compensate, and take the edge off a hot tweeter.
#
# The `number` entities make each parameter adjustable from Home Assistant, so
# you can tune by ear in the room instead of spending an OTA cycle per change.
# The index passed to set_dsp_filter_* is positional into `filters:` — reorder
# that list and every control below points at the wrong filter.

esphome:
  name: airplay-study
  friendly_name: Study
  min_version: 2025.1.0

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  cpu_frequency: 240MHz
  flash_size: 8MB
  flash_mode: dio
  flash_frequency: 80MHz
  framework:
    type: esp-idf
    version: recommended
  toolchain: esp-idf
  partitions: ../partitions.csv

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  # No `encryption:` here, and that is not an oversight. API encryption pulls in
  # esphome/noise-c, which bundles its own libsodium; the component needs
  # espressif/libsodium for the pairing crypto, and the IDF component manager
  # refuses to choose between two components both claiming to provide libsodium.
  # The build fails at CMake configure with "Can't decide which one to pick".

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: INFO

external_components:
  - source: github://henriklied/airplay2-esphome
    components: [airplay_receiver]

airplay_receiver:
  id: airplay
  name: "Study"
  i2s_bclk_pin: 14
  i2s_lrclk_pin: 15
  i2s_dout_pin: 16
  amp_enable_pin: 17
  sample_rate: 44100
  amp_idle_timeout: 60

  dsp:
    # The +4 dB shelf below spends 4 dB of headroom; this buys it back. Without
    # it the stage clamps on peaks and you hear distortion, not clipping noise.
    # The component logs the preamp it wants at boot — check that line after
    # changing any gain.
    preamp: -4dB
    filters:
      - type: high_pass      # [0] keep cone excursion out of the inaudible
        frequency: 80Hz      #     bottom end, where it only costs headroom
        q: 0.7
      - type: low_shelf      # [1] and put some of that warmth back
        frequency: 150Hz
        q: 0.7
        gain: 4dB
      - type: high_shelf     # [2] tame a bright tweeter
        frequency: 6kHz
        q: 0.7
        gain: -2dB

number:
  # Values are applied from on_value rather than set_action: restore_value
  # republishes the stored value at boot without going through the set action,
  # and hanging the work off on_value covers both the restore and a user edit.
  - platform: template
    name: "DSP high-pass"
    id: dsp_high_pass
    icon: mdi:sine-wave
    unit_of_measurement: Hz
    device_class: frequency
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 80
    min_value: 20
    max_value: 200
    step: 5
    mode: box
    on_value:
      then:
        - lambda: id(airplay).set_dsp_filter_frequency(0, x);

  - platform: template
    name: "DSP bass lift"
    id: dsp_low_shelf_gain
    icon: mdi:tune
    unit_of_measurement: dB
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 4
    min_value: -6
    max_value: 9
    step: 0.5
    mode: slider
    on_value:
      then:
        - lambda: id(airplay).set_dsp_filter_gain(1, x);

  - platform: template
    name: "DSP treble tilt"
    id: dsp_high_shelf_gain
    icon: mdi:tune
    unit_of_measurement: dB
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: -2
    min_value: -9
    max_value: 6
    step: 0.5
    mode: slider
    on_value:
      then:
        - lambda: id(airplay).set_dsp_filter_gain(2, x);

  - platform: template
    name: "DSP preamp"
    id: dsp_preamp
    icon: mdi:volume-medium
    unit_of_measurement: dB
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: -4
    min_value: -12
    max_value: 0
    step: 0.5
    mode: slider
    on_value:
      then:
        - lambda: id(airplay).set_dsp_preamp(x);

switch:
  # Bypass is bit-exact, so this is a real A/B rather than a rough comparison.
  - platform: template
    name: "DSP enabled"
    id: dsp_enabled
    icon: mdi:equalizer
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(airplay).set_dsp_enabled(true);
    turn_off_action:
      - lambda: id(airplay).set_dsp_enabled(false);
