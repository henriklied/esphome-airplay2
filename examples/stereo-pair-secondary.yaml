# Stereo pair, secondary half. Pairs with stereo-pair-primary.yaml.
#
# No AirPlay discovery, RTSP or decoding runs here: the board plays what the
# primary forwards, at the primary's network time, through its own DAC and
# DSP. Its media_player entity mirrors the pair and ignores commands; control
# the primary.

esphome:
  name: airplay-living-room-r
  friendly_name: Living Room Right
  min_version: 2025.1.0

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  cpu_frequency: 240MHz
  flash_size: 8MB
  # N8R8 is quad flash + octal PSRAM. `opi` describes the PSRAM, not the
  # flash, and setting it here produces a board that does not boot.
  flash_mode: dio
  flash_frequency: 80MHz
  framework:
    type: esp-idf
    version: recommended
  toolchain: esp-idf
  # The default ESPHome layout leaves too little room for two OTA slots once
  # the codec and crypto libraries are linked in.
  partitions: ../partitions.csv

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Modem sleep holds incoming frames until the next beacon, tens of
  # milliseconds late and unevenly so. The pair's clock exchange reads that
  # as path asymmetry, which is clock error.
  power_save_mode: none

api:
  # No `encryption:` here, and that is not an oversight. API encryption pulls in
  # esphome/noise-c, which bundles its own libsodium; the component needs
  # espressif/libsodium for the pairing crypto, and the IDF component manager
  # refuses to choose between two components both claiming to provide libsodium.
  # The build fails at CMake configure with "Can't decide which one to pick".

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  # INFO keeps the one-line playout summary the receiver logs every second.
  # DEBUG formats far more lines on the core that feeds I2S.
  level: INFO

external_components:
  - source: github://henriklied/esphome-airplay2
    components: [airplay_receiver]

airplay_receiver:
  id: airplay
  # The media_player entity name. Senders never see this board.
  name: "Living Room Right"
  i2s_bclk_pin: 14
  i2s_lrclk_pin: 15
  i2s_dout_pin: 16
  amp_enable_pin: 17
  sample_rate: 44100
  # Drop the amp after a minute of silence. The PCM5100 idles near-silent but
  # the TPA311x hisses, which is audible in a quiet room at night.
  amp_idle_timeout: 60
  # A one-channel forward arrives on both outputs.
  audio_channel_mode: stereo
  pair:
    role: secondary
    # Accept audio only from this primary. Leave out to accept the first
    # that speaks.
    peer: 192.168.1.50
    # Network clock to play against. `auto` uses this board's own PTP lock to
    # the sender when it has one and otherwise the primary's clock relayed over
    # the link; `ptp` and `relay` force one, for measuring which aligns better.
    clock: auto
    # Plays this much later than the primary. Only needed if the two output
    # paths differ, e.g. a DSP stage on one side only.
    delay: 0us
