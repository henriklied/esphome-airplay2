# ESP32-S3-N16R8 + 020A / DLT1120 optical S/PDIF transmitter, driven directly
# from GPIO21. No DAC chip: the transmitter's DATA pin takes the GPIO signal.
#
# The 020A VCC pin is 5V; DATA is the ESP32's 3.3V logic output.

esphome:
  name: airplay-spdif
  friendly_name: SPDIF Speaker
  min_version: 2025.1.0

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  cpu_frequency: 240MHz
  flash_size: 16MB
  flash_mode: dio
  flash_frequency: 80MHz
  framework:
    type: esp-idf
    version: recommended
  toolchain: esp-idf
  partitions: ../partitions.csv

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  # No `encryption:` — see README (libsodium collision).

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: INFO

external_components:
  - source:
      type: local
      path: ../components
    components: [airplay_receiver]

airplay_receiver:
  id: airplay
  name: "SPDIF Speaker"
  output: spdif
  spdif_dout_pin: GPIO21
  sample_rate: 44100
