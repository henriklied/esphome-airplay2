[project]
name = "airplay-measure"
version = "0.1.0"
description = "Measure a speaker in its room with a phone, and fit the board's parametric EQ to it"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13", "matplotlib>=3.9", "orjson>=3.10"]

[project.scripts]
airplay-measure = "airplay_measure.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110

[tool.mypy]
strict = true
ignore_missing_imports = true
