---
# Reference CI build config for the airplay_receiver component, mirroring how
# esphome's tests/components/<component>/test.esp32-s3-idf.yaml look.
#
# In a real upstream PR this file lives at
#   esphome/tests/components/airplay_receiver/test.esp32-s3-idf.yaml
# and the component is imported from the esphome monorepo (esphome/components/) —
# no external_components block is needed there. Here it is a self-contained,
# esp32-s3-idf build config that exercises the component for CI.
#
# NOTE: This is a codegen/reference config. The full `esphome compile` requires
# the ESP-IDF toolchain (not installed in the dev workspace); `esphome config`
# and `esphome compile --only-generate` validate the schema and codegen.
esphome:
  name: test
  friendly_name: test
  min_version: 2024.8.0

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  cpu_frequency: 240MHz
  flash_size: 8MB
  flash_mode: opi
  framework:
    type: esp-idf
    version: recommended

psram:
  mode: octal
  speed: 80MHz

wifi:
  ap: {}

logger:
  level: warn

airplay_receiver:
  id: airplay_test
  name: "AirPlay2"
  buffer_size: 1000000
