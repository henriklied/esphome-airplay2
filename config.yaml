esphome:
  name: airplay2
  friendly_name: AirPlay2
  min_version: 2024.8.0

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  cpu_frequency: 240MHz
  flash_size: 8MB
  flash_mode: opi
  flash_frequency: 80MHz
  framework:
    type: esp-idf
    version: recommended
  toolchain: esp-idf
  partitions: partitions.csv

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: "!secret wifi_ssid"
  password: "!secret wifi_password"

api:
  encryption:
    key: "!secret api_key"

ota:
  - platform: esphome
    password: "!secret ota_password"

logger:

external_components:
  - source:
      type: local
      path: components
    components:
      - airplay_receiver

airplay_receiver:
  id: airplay_1
  name: "AirPlay2"
  buffer_size: 1000000
